name: slay
description: >
  SLAY (Surface Localized Antimicrobial displaY) benchmark dataset.
  Large-scale screening library with binary activity labels derived from
  log-fold-change enrichment (lfcMLE). Class 1 = enriched (antimicrobial),
  class 0 = not enriched.
