# =============================================================================
# BattleAMP Benchmark Configuration
# =============================================================================

# --- Models to benchmark ---
# Each model must have a directory under models/ with model.yaml and inference.sh
models:
  - example-model
  - ampeppy
  - amplify
  - ampscanner
  - ampredmfa

# --- Datasets ---
# Each dataset is a FASTA file that models run inference on.
# Models run ONCE per dataset. Multiple tasks can share the same dataset.
datasets:
  example-dataset:
    sequences: datasets/example-dataset/sequences.fasta
  battleamp-all:
    sequences: datasets/battleamp-all/sequences.fasta

# --- Tasks ---
# Each task defines an evaluation: which dataset's predictions to score,
# against which labels, using which metric type.
#
# type: classification | regression | paired (paired is not yet implemented)
# dataset: which dataset the task evaluates predictions from
# labels: path to TSV with ground truth (relative to repo root)
# model_type: classifier | regressor (which models this task applies to)

tasks:
  # --- Keep example task for testing ---
  example_classification:
    type: classification
    dataset: example-dataset
    labels: datasets/example-dataset/labels.tsv
    model_type: classifier

  # === A1: AMP identification ===
  amp:
    type: classification
    dataset: battleamp-all
    labels: tasks/amp/labels.tsv
    model_type: classifier

  # === A2: Broad-spectrum activity ===
  broad_activity:
