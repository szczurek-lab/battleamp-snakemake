$schema: "http://json-schema.org/draft-07/schema#"
description: "Schema for amp-benchmark-pipeline config.yaml"

type: object
required:
  - models_dir
  - datasets_dir
  - output_dir
  - models
  - datasets
  - tasks

properties:
  models_dir:
    type: string
    description: "Path to directory containing model subdirectories"

  datasets_dir:
    type: string
    description: "Path to directory containing dataset subdirectories"

  output_dir:
    type: string
    description: "Path to directory for all pipeline outputs"

  sequence_column:
    type: string
    default: "sequence"
    description: "Column name for sequences in TSV files"

  models:
    type: array
    items:
      type: string
    minItems: 1
    description: "List of model directory names to benchmark"

  datasets:
    type: array
    items:
      type: string
    minItems: 1
    description: "List of dataset directory names"

  tasks:
    type: object
    additionalProperties:
      type: object
      required:
        - dataset
        - type
      properties:
        dataset:
          type: string
        type:
          type: string
          enum: ["classification", "regression"]
        label_column:
          type: string
        positive_label:
          type: string
        mic_column:
          type: string
        mic_unit_column:
          type: string
        target_unit:
          type: string
          enum: ["ug/ml", "uM"]
        metrics:
          type: array
          items:
            type: string
        models:
          oneOf:
            - type: string
              enum: ["all"]
            - type: array
              items:
                type: string
        description:
          type: string
